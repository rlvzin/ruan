<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duelo de Ritmo</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#100d2c;color:#fff;font-family:monospace;display:grid;place-items:center;min-height:100vh}
.wrap{width:min(960px,100%);padding:12px}
h1{margin:0 0 8px;text-align:center;color:#e5c6ff;text-shadow:3px 3px #6b1db5;letter-spacing:2px}
canvas{width:100%;height:auto;display:block;border:4px solid #09071a;image-rendering:pixelated;background:#20155b}
.help{text-align:center;line-height:1.7;font-size:14px;color:#d9d4ff;margin:10px 0}
button{font: bold 16px monospace;padding:12px 18px;background:#8d26e8;color:white;border:3px solid #fff;box-shadow:4px 4px #401075;cursor:pointer}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.mobile{display:grid;grid-template-columns:repeat(4,58px);gap:8px;justify-content:center;margin:14px auto}
.mobile button{padding:10px 0;font-size:24px;touch-action:manipulation}
small{display:block;text-align:center;color:#aaa4db;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
<h1>🎤 DUELO DE RITMO</h1>
<canvas id="game" width="960" height="540" aria-label="Jogo de ritmo"></canvas>
<div class="help">Use ← ↓ ↑ → quando as notas chegarem às setas de cima.<br>Acertar aumenta a pontuação e o combo. Errar diminui sua vida!</div>
<div class="controls"><button id="start">COMEÇAR / REINICIAR</button><button id="sound">SOM: LIGADO</button></div>
<div class="mobile" aria-label="Controles para celular">
<button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowUp">↑</button><button data-key="ArrowRight">→</button>
</div>
<small>Feito para navegador • Funciona no celular e no computador</small>
</div>
<script>
(() => {
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=960,H=540, lanes=[190,385,580,775], symbols=['←','↓','↑','→'];
let notes=[], score=0, combo=0, best=0, misses=0, health=100, started=false, over=false;
let startTime=0,lastSpawn=0, songTime=0, soundOn=true, audio=null, lastHit=[0,0,0,0];
const beat=520, noteSpeed=260, hitY=145;
function audioStart(){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function tone(freq,dur=.09,type='square',vol=.045){if(!soundOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function reset(){notes=[];score=0;combo=0;misses=0;health=100;started=true;over=false;startTime=performance.now();lastSpawn=0;songTime=0;audioStart()}
document.getElementById('start').onclick=reset;
document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent='SOM: '+(soundOn?'LIGADO':'DESLIGADO');if(soundOn)audioStart()};
function spawn(){let lane=Math.floor(Math.random()*4);notes.push({lane,y:-20,hit:false});}
function hit(lane){if(!started||over)return;let candidates=notes.filter(n=>n.lane===lane&&!n.hit&&Math.abs(n.y-hitY)<58).sort((a,b)=>Math.abs(a.y-hitY)-Math.abs(b.y-hitY));if(candidates.length){let n=candidates[0];n.hit=true;combo++;best=Math.max(best,combo);score+=Math.max(50,100-Math.abs(n.y-hitY));health=Math.min(100,health+2);lastHit[lane]=performance.now();tone([330,392,440,523][lane]);}else{combo=0;misses++;health-=7;tone(110,.12,'sawtooth',.035)}}
window.addEventListener('keydown',e=>{const map={'ArrowLeft':0,'ArrowDown':1,'ArrowUp':2,'ArrowRight':3,'a':0,'s':1,'w':2,'d':3};if(map[e.key]!==undefined){e.preventDefault();hit(map[e.key])}if(e.key===' '&&!started)reset()});
document.querySelectorAll('[data-key]').forEach(b=>{const lane=['ArrowLeft','ArrowDown','ArrowUp','ArrowRight'].indexOf(b.dataset.key);b.addEventListener('pointerdown',e=>{e.preventDefault();hit(lane)})});
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function pixelGuy(x,y,scale=4){
 // character in cap and purple striped shirt, pixel blocks
 const p=(a,b,w,h,c)=>rect(x+a*scale,y+b*scale,w*scale,h*scale,c);
 p(7,0,13,3,'#171322');p(4,3,19,2,'#171322');p(3,5,21,2,'#d9c9e9');p(5,7,17,2,'#171322');
 p(7,7,13,10,'#f1b18b');p(5,8,3,7,'#171322');p(19,8,3,7,'#171322');
 p(9,10,3,3,'#fff');p(15,10,3,3,'#fff');p(10,11,2,2,'#24172a');p(16,11,2,2,'#24172a');p(12,15,5,1,'#63302e');p(12,17,5,1,'#171322');
 p(5,19,17,10,'#5e2090');p(4,21,19,1,'#d4c2e5');p(4,25,19,1,'#d4c2e5');p(6,29,15,2,'#171322');
 p(3,30,7,7,'#171322');p(17,30,7,7,'#171322');p(2,36,9,2,'#f4e9ff');p(16,36,10,2,'#f4e9ff');
}
function girl(x,y,scale=4){const p=(a,b,w,h,c)=>rect(x+a*scale,y+b*scale,w*scale,h*scale,c);
 p(5,0,14,3,'#8d252d');p(2,3,20,8,'#b52e3d');p(4,5,16,10,'#ffc2d0');p(3,9,4,10,'#b52e3d');p(17,9,5,10,'#b52e3d');p(7,7,3,3,'#171322');p(15,7,3,3,'#171322');p(10,13,5,2,'#d52b50');p(6,17,13,8,'#f6d7e3');p(4,25,17,2,'#171322');p(5,27,6,6,'#e92f5d');p(15,27,6,6,'#e92f5d');
}
function draw(){ctx.clearRect(0,0,W,H);
 // night city pixel background
 rect(0,0,W,H,'#17104b');rect(0,245,W,295,'#39206d');
 for(let i=0;i<16;i++){let x=i*64;let bh=100+(i*37%130);rect(x,235-bh,52,bh,'#24164f');for(let yy=250-bh;yy<230;yy+=35)for(let xx=x+10;xx<x+48;xx+=22)rect(xx,yy,8,12,'#f7a65d')}
 rect(820,30,72,72,'#f5d6a1');rect(834,18,72,72,'#17104b');
 // speaker stage
 rect(340,365,280,115,'#0a0818');rect(350,375,260,95,'#30204a');rect(375,390,70,70,'#100b20');rect(515,390,70,70,'#100b20');rect(390,405,40,40,'#5b4477');rect(530,405,40,40,'#5b4477');
 pixelGuy(120,238,5);girl(675,245,5);
 // HUD
 rect(22,18,916,58,'#080616');ctx.fillStyle='#fff';ctx.font='bold 24px monospace';ctx.fillText('SCORE: '+score,40,42);ctx.fillText('COMBO: '+combo,40,66);ctx.fillText('MISS: '+misses,730,42);
 rect(370,25,220,22,'#30204a');rect(372,27,Math.max(0,216*health/100),18,health>30?'#9b28ee':'#e63952');
 // receptors
 for(let i=0;i<4;i++){ctx.font='bold 64px monospace';ctx.textAlign='center';ctx.fillStyle=performance.now()-lastHit[i]<130?'#fff36a':'#a99acb';ctx.strokeStyle='#080616';ctx.lineWidth=7;ctx.strokeText(symbols[i],lanes[i],hitY);ctx.fillStyle=performance.now()-lastHit[i]<130?'#fff36a':'#d9d3ff';ctx.fillText(symbols[i],lanes[i],hitY);ctx.textAlign='left'}
 for(const n of notes){ctx.textAlign='center';ctx.font='bold 58px monospace';ctx.lineWidth=7;ctx.strokeStyle='#090619';ctx.strokeText(symbols[n.lane],lanes[n.lane],n.y);ctx.fillStyle=['#f36bff','#61eaff','#f7e85e','#ff6c9d'][n.lane];ctx.fillText(symbols[n.lane],lanes[n.lane],n.y);ctx.textAlign='left'}
 if(!started){rect(160,200,640,100,'#080616');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 32px monospace';ctx.fillText('APERTE COMEÇAR',480,245);ctx.font='18px monospace';ctx.fillText('SETAS DO TECLADO OU BOTÕES',480,278);ctx.textAlign='left'}
 if(over){rect(250,205,460,120,'#080616');ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 36px monospace';ctx.fillText(health<=0?'VOCÊ PERDEU!':'MÚSICA FINALIZADA!',480,252);ctx.font='22px monospace';ctx.fillText('PONTOS: '+score,480,292);ctx.textAlign='left'}
}
function loop(now){if(started&&!over){let elapsed=now-startTime;songTime=elapsed;if(elapsed-lastSpawn>beat){spawn();lastSpawn=elapsed}for(const n of notes){if(!n.hit)n.y+=noteSpeed/60;if(!n.hit&&n.y>hitY+68){n.hit=true;combo=0;misses++;health-=8}}
 notes=notes.filter(n=>n.y<570&&!n.hit);if(health<=0||elapsed>90000)over=true}
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
